<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Effective BST</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  /* Style: apa / sadya brand (~/apa/STYLE.md, phase-7 calibration). Dark-first.
     Hairline boxes, no fills; square corners except pills; space separates rows, never lines.
     Layout: sticky control band, then one boxed ranking table, then a ⋯ explainer list. */
  :root {
    --paper: #e8e3e4; --wall: #100c0e;
    --seal: #961e14; --seal-deep: #731c15;
    --lavender: #5d5382; --lav-deep: #4a4168;
    --surface: var(--wall);
    --fg-strong: #e8e3e4; --fg: #a59699; --fg-secondary: #615254; --fg-muted: #382f30; --fg-faint: #241d20;
    --lav-text: #574f78;
    --accent: var(--seal); --accent-deep: var(--seal-deep);
    --rule: rgba(232, 227, 228, 0.10);
    --h-1: var(--accent); --h-2: var(--lav-text); --h-3: var(--lav-text); --h-4: var(--fg);
    --serif: "Crimson Pro", "Iowan Old Style", Georgia, serif;
    --sans: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --page: 1060px;
    --ease: cubic-bezier(0.2, 0.8, 0.2, 1);
    color-scheme: dark;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --surface: var(--paper); --lav-text: var(--lavender);
      --fg-strong: #1d1719; --fg: #332b2e; --fg-secondary: #6b5e5b; --fg-muted: #8a7a78; --fg-faint: #a89e9c;
      --rule: rgba(16, 12, 14, 0.12);
      color-scheme: light;
    }
  }
  :root[data-theme="light"] {
    --surface: var(--paper); --lav-text: var(--lavender);
    --fg-strong: #1d1719; --fg: #332b2e; --fg-secondary: #6b5e5b; --fg-muted: #8a7a78; --fg-faint: #a89e9c;
    --rule: rgba(16, 12, 14, 0.12);
    color-scheme: light;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--surface); color: var(--fg);
    font-family: var(--sans); font-size: 16px; line-height: 1.6; -webkit-font-smoothing: antialiased;
  }
  body::before {
    content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);
    z-index: 10; background: var(--surface);
  }
  h1 { font-family: var(--serif); font-weight: 400; margin: 0; text-wrap: balance; color: var(--fg); font-size: 30px; line-height: 1.24; }
  p { margin: 0; max-width: 66ch; }
  .kicker { font-size: 12px; text-transform: lowercase; letter-spacing: 0.09em; color: var(--fg-muted); }
  .gutter {
    max-width: var(--page); margin: 0 auto;
    padding-left: max(32px, env(safe-area-inset-left, 0px));
    padding-right: max(32px, env(safe-area-inset-right, 0px));
  }
  button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* Header */
  header .inner { display: flex; flex-direction: column; gap: 12px; padding-block: 64px 8px; }

  /* Settings panel: one hairline box, a "score" row and a "filter" row; every control is its own cell.
     Wide: a 4-column grid so cells line up across rows. Narrower: each row wraps its cells. */
  .panel {
    display: grid; grid-template-columns: auto repeat(3, minmax(0, 1fr));
    border: 0.5px solid var(--rule);
  }
  .panel-row { display: contents; }
  .row-label {
    font-family: var(--mono); font-size: 11px; text-transform: lowercase; letter-spacing: 0.08em;
    color: var(--lav-text); padding: 20px 28px 20px 26px;
  }
  .control { display: flex; flex-direction: column; gap: 8px; padding: 18px 28px; min-width: 0; border-left: 0.5px solid var(--rule); }
  .panel-row + .panel-row > * { border-top: 0.5px solid var(--rule); }
  .slabel {
    font-family: var(--mono); font-size: 11px; text-transform: lowercase; letter-spacing: 0.08em; color: var(--fg-muted);
  }
  .hint { font-family: var(--mono); font-size: 11px; color: var(--fg-secondary); }
  .control-line { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; }
  .control select, .control input[type="number"] {
    font: 14px var(--sans); color: var(--fg); background: var(--surface);
    border: 0.5px solid var(--rule); border-radius: 0; padding: 5px 8px;
  }
  .control input[type="number"] { font-family: var(--mono); width: 4.2em; text-align: right; }
  .control-line label { font-size: 13px; color: var(--fg-secondary); display: inline-flex; align-items: center; gap: 8px; }
  .control select { align-self: flex-start; }
  .chips { display: inline-flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    font-family: var(--sans); font-size: 12px; padding: 1px 10px; border: 0.5px solid var(--rule);
    border-radius: 999px; background: transparent; color: var(--fg); cursor: pointer;
    transition: color 180ms var(--ease), border-color 180ms var(--ease);
  }
  .chip .x { color: var(--fg-muted); margin-left: 4px; }
  .chip:hover, .chip:hover .x { color: var(--fg-strong); border-color: var(--accent); }

  /* Segmented pick-one: a hairline track; the chosen option carries the oxblood outline. */
  .seg {
    display: inline-flex; align-self: flex-start; gap: 2px; padding: 3px;
    border: 0.5px solid var(--rule); border-radius: 999px;
  }
  .seg button {
    font-family: var(--sans); font-size: 13px; padding: 4px 14px; border: 0.5px solid transparent;
    border-radius: 999px; background: transparent; color: var(--fg-secondary); cursor: pointer;
    transition: color 180ms var(--ease), border-color 180ms var(--ease);
  }
  .seg button:hover { color: var(--fg-strong); }
  .seg button[aria-checked="true"] { color: var(--fg-strong); border-color: var(--accent); }

  /* Main */
  main { display: flex; flex-direction: column; padding-block: 40px; }
  section { margin-bottom: 40px; display: flex; flex-direction: column; gap: 20px; }
  section:last-of-type { margin-bottom: 0; }
  .count { font-family: var(--mono); font-size: 12px; color: var(--fg-muted); font-variant-numeric: tabular-nums; }
  .sub { font-size: 14px; color: var(--fg-muted); line-height: 1.5; }
  .sub b { font-weight: 500; color: var(--fg); }

  /* Rankings toolbar: search and export only. */
  .toolbar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; }
  .toolbar input[type="search"] {
    font: 15px var(--sans); color: var(--fg); background: transparent; flex: 1 1 240px; max-width: 360px;
    border: 0.5px solid var(--rule); border-radius: 0; padding: 7px 12px;
  }
  .toolbar input[type="search"]::placeholder { color: var(--fg-muted); }
  .toolbar-end { display: inline-flex; align-items: center; gap: 14px; }
  .pill {
    font-family: var(--sans); font-size: 13px; padding: 5px 14px; border: 0.5px solid var(--rule);
    border-radius: 999px; background: transparent; color: var(--fg-secondary); cursor: pointer;
    transition: color 180ms var(--ease);
  }
  .pill:hover { color: var(--fg-strong); }
  .textbtn {
    font-family: var(--mono); font-size: 12px; color: var(--fg-secondary); background: none; border: 0;
    padding: 0; cursor: pointer; transition: color 180ms var(--ease);
  }
  .textbtn:hover { color: var(--fg-strong); }

  /* Ranking table: one hairline box, rows separated by space */
  .list { border: 0.5px solid var(--rule); border-radius: 0; padding: 14px 0; }
  /* Still swipe/trackpad-scrollable when narrow, but without scroll-bar chrome. */
  .table-scroll { overflow-x: auto; scrollbar-width: none; }
  .table-scroll::-webkit-scrollbar { display: none; }
  table { border-collapse: collapse; width: 100%; min-width: 720px; font-variant-numeric: tabular-nums; }
  th, td { padding: 9px 12px; text-align: right; white-space: nowrap; vertical-align: baseline; }
  th:first-child, td:first-child { padding-left: 26px; }
  th:last-child, td:last-child { padding-right: 26px; }
  th {
    font-family: var(--mono); font-weight: 400; font-size: 11px; text-transform: lowercase;
    letter-spacing: 0.08em; color: var(--fg-muted); padding-bottom: 14px;
  }
  th button { all: unset; cursor: pointer; transition: color 180ms var(--ease); }
  th button:hover { color: var(--fg-strong); }
  th button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  th[aria-sort="descending"] button, th[aria-sort="ascending"] button { color: var(--fg); }
  th[aria-sort="descending"] button::after { content: " ↓"; color: var(--accent); }
  th[aria-sort="ascending"] button::after { content: " ↑"; color: var(--accent); }
  .l { text-align: left; }
  td.rank { font-family: var(--mono); font-size: 12px; color: var(--fg-muted); width: 3em; }
  td.name { font-size: 16px; color: var(--fg); position: sticky; left: 0; background: var(--surface); }
  th.name { position: sticky; left: 0; background: var(--surface); }
  .tag {
    font-family: var(--mono); font-size: 11px; text-transform: lowercase; letter-spacing: 0.06em;
    color: var(--fg-muted); border: 0.5px solid var(--rule); border-radius: 999px; padding: 0 8px; margin-left: 8px;
  }
  td.stat { font-family: var(--mono); font-size: 14px; color: var(--fg); width: 3.4em; }
  td.stat.unused { color: var(--fg-muted); text-decoration: line-through; }
  td.stat.neg { color: var(--accent); }
  td.bst { font-family: var(--mono); font-size: 14px; color: var(--fg-secondary); }

  .seg.off { padding: 2px; }
  .seg.off button { font-size: 12px; padding: 0 10px; }
  .off-fixed { font-size: 13px; color: var(--fg-secondary); }
  .off-idle button, .off-idle.off-fixed { color: var(--fg-muted); }
  .off-idle button[aria-checked="true"] { border-color: var(--rule); }

  td.score { width: 190px; }
  .score-cell { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 12px; }
  .score-bar { height: 3px; background: var(--rule); }
  .score-bar i { display: block; height: 100%; background: var(--lavender); }
  .score-num { font-family: var(--mono); font-size: 15px; font-weight: 500; color: var(--fg-strong); min-width: 2.6em; }
  td.empty { text-align: center; color: var(--fg-muted); padding: 32px 26px; font-size: 14px; }

  /* Tabs: one per view; the open one carries an oxblood underline. */
  .tabs { display: flex; flex-wrap: wrap; gap: 6px 24px; margin-top: 10px; }
  .tabs button {
    all: unset; cursor: pointer; font-family: var(--mono); font-size: 12px; text-transform: lowercase;
    letter-spacing: 0.08em; color: var(--fg-secondary); padding-bottom: 4px; border-bottom: 1px solid transparent;
    transition: color 180ms var(--ease), border-color 180ms var(--ease);
  }
  .tabs button:hover { color: var(--fg-strong); }
  .tabs button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .tabs button[aria-selected="true"] { color: var(--fg-strong); border-bottom-color: var(--accent); }
  .view { display: flex; flex-direction: column; }
  .view[hidden], section[hidden] { display: none; }

  /* Speed Tiers */
  .control input[type="text"] {
    font: 14px var(--sans); color: var(--fg); background: var(--surface); width: 100%; max-width: 15em;
    border: 0.5px solid var(--rule); border-radius: 0; padding: 5px 8px;
  }
  .control input[type="text"]::placeholder { color: var(--fg-muted); }
  .chip.toggle { color: var(--fg-secondary); }
  .chip.toggle[aria-pressed="true"] { color: var(--fg-strong); border-color: var(--accent); }
  .toolbar .seg-group { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  #view-speed .toolbar-end { flex-wrap: wrap; }
  .star, .train { all: unset; cursor: pointer; transition: color 180ms var(--ease); }
  .star { font-size: 14px; color: var(--fg-muted); padding: 0 2px; }
  .star[aria-pressed="true"] { color: var(--accent); }
  .star:hover, .train:hover { color: var(--fg-strong); }
  .star:focus-visible, .train:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  td.name .star { margin-right: 8px; }
  td.stat.sorted { color: var(--fg-strong); }
  table.needs { min-width: 640px; }
  td.spd-num { font-family: var(--mono); font-size: 15px; font-weight: 500; color: var(--fg-strong); width: 3.4em; }
  td.spread { font-family: var(--mono); font-size: 12px; color: var(--fg-secondary); }
  td.need { font-family: var(--mono); font-size: 14px; color: var(--fg); }
  td.how { font-family: var(--mono); font-size: 12px; color: var(--fg-secondary); }
  .how-part + .how-part::before { content: " · "; color: var(--fg-muted); }
  .muted { color: var(--fg-muted); }
  td.vs { font-size: 13px; }
  tr.first td.vs { color: var(--fg); }
  tr.tie td.vs { color: var(--accent); }
  tr.second td.vs { color: var(--fg-muted); }
  tr.you td { color: var(--fg-strong); padding-block: 14px; }
  tr.you td.spd-num { color: var(--accent); }
  tr.fold td, tr.fold .textbtn { text-align: left; }
  tr.fold td { padding-block: 10px; white-space: normal; }
  .nowrap { white-space: nowrap; }
  .spread-inline, .how-inline { display: none; font-family: var(--mono); font-size: 11px; color: var(--fg-secondary); }
  td.star-col { width: 2em; }

  /* Footer */
  footer { margin-top: 24px; padding-block: 22px 56px; color: var(--fg-faint); font-size: 13px; }
  footer .inner { padding-top: 20px; border-top: 0.5px solid var(--rule); }
  .endmark { display: flex; justify-content: center; padding-top: 22px; }

  @media (max-width: 1000px) {
    .panel { display: block; }
    .panel-row { display: flex; flex-wrap: wrap; gap: 16px 36px; padding: 18px 22px; }
    .panel-row + .panel-row { border-top: 0.5px solid var(--rule); }
    .panel-row + .panel-row > * { border-top: 0; }
    .row-label { flex-basis: 100%; padding: 0; }
    .control { padding: 0; border-left: 0; }
  }
  @media (max-width: 960px) {
    th, td { padding-left: 7px; padding-right: 7px; }
    th:first-child, td:first-child { padding-left: 16px; }
    th:last-child, td:last-child { padding-right: 16px; }
    td.score { width: auto; }
    th.score { white-space: normal; width: 5.5em; }
    th[data-sort="hp"] { white-space: normal; }
    .seg.off button { padding: 0 7px; }
    .tag { margin-left: 6px; padding: 0 6px; }
    .score-cell { grid-template-columns: auto; }
    .score-bar { display: none; }
  }
  /* Narrow speed list: the spread moves under the name and "how" under "you need". The list's own
     order shows who moves first, so that column goes. */
  @media (max-width: 800px) {
    table.needs { min-width: 0; }
    table.needs .vs, table.needs .spread-col, table.needs .how-col, table.needs td.name .star { display: none; }
    table.needs th, table.needs td.name { white-space: normal; }
    td.spd-num { width: auto; }
    .spread-inline, .how-inline { display: block; }
    .how-part { display: block; }
    .how-part + .how-part::before { content: none; }
  }
  @media (max-width: 640px) {
    .gutter {
      padding-left: max(22px, env(safe-area-inset-left, 0px));
      padding-right: max(22px, env(safe-area-inset-right, 0px));
    }
    header .inner { padding-top: 40px; }
    .panel-row { flex-direction: column; gap: 18px; padding: 16px 18px; }
  }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>

<header class="gutter">
  <div class="inner">
    <p class="kicker">vgc 2026 reg m-c · pokémon champions</p>
    <h1 id="page-title">Effective BST</h1>
    <div class="tabs" role="tablist" aria-label="Views">
      <button type="button" role="tab" id="tab-ebst" data-view="ebst" aria-controls="view-ebst">effective bst</button>
      <button type="button" role="tab" id="tab-speed" data-view="speed" aria-controls="view-speed">speed tiers</button>
    </div>
  </div>
</header>

<main class="gutter">
  <div class="view" id="view-ebst" role="tabpanel" aria-labelledby="tab-ebst">
  <section aria-label="Settings">
    <div class="panel">
    <div class="panel-row" role="group" aria-label="Scoring">
    <span class="row-label">score</span>
    <div class="control">
      <span class="slabel" id="label-model">model</span>
      <div class="seg" role="radiogroup" aria-labelledby="label-model" data-group="model">
        <button type="button" role="radio" id="model-sum" data-value="sum">Effective Sum</button>
        <button type="button" role="radio" id="model-bsr" data-value="bsr">BSR</button>
      </div>
      <span class="hint" id="hint-model"></span>
    </div>
    <div class="control">
      <span class="slabel" id="label-focus">focus</span>
      <div class="seg" role="radiogroup" aria-labelledby="label-focus" data-group="focus">
        <button type="button" role="radio" id="focus-full" data-value="full">Full</button>
        <button type="button" role="radio" id="focus-bulk" data-value="bulk">Bulk</button>
        <button type="button" role="radio" id="focus-offense" data-value="offense">Offense</button>
      </div>
      <span class="hint" id="hint-focus"></span>
    </div>
    <div class="control">
      <span class="slabel" id="label-speed">speed</span>
      <div class="seg" role="radiogroup" aria-labelledby="label-speed" data-group="speed">
        <button type="button" role="radio" id="speed-off" data-value="off">Off</button>
        <button type="button" role="radio" id="speed-on" data-value="on">On</button>
        <button type="button" role="radio" id="speed-tr" data-value="tr">Trick Room</button>
      </div>
      <span class="hint" id="hint-speed"></span>
    </div>
    </div>
    <div class="panel-row" role="group" aria-label="Filters">
    <span class="row-label">filter</span>
    <div class="control">
      <label class="slabel" for="type-filter">type</label>
      <select id="type-filter" aria-label="Show only this type">
        <option value="">Any type</option>
      </select>
      <div class="control-line">
        <select id="type-exclude" aria-label="Exclude a type"></select>
        <span class="chips" id="excluded-types"></span>
      </div>
      <span class="hint" id="hint-type"></span>
    </div>
    <div class="control">
      <span class="slabel" id="label-megas">megas</span>
      <div class="seg" role="radiogroup" aria-labelledby="label-megas" data-group="megas">
        <button type="button" role="radio" data-value="include">Include</button>
        <button type="button" role="radio" data-value="exclude">Exclude</button>
        <button type="button" role="radio" data-value="only">Only</button>
      </div>
      <span class="hint" id="hint-megas"></span>
    </div>
    <div class="control">
      <span class="slabel" id="label-mixed">mixed attackers</span>
      <div class="control-line">
        <div class="seg" role="radiogroup" aria-labelledby="label-mixed" data-group="mixed">
          <button type="button" role="radio" data-value="all">All</button>
          <button type="button" role="radio" data-value="only">Only</button>
        </div>
        <label for="mixed-threshold" title="A Pokémon counts as a mixed attacker, and gets the Phys / Spec / Both picker, when both its Atk and SpA are at least this base stat.">
          both attacks ≥ <input type="number" id="mixed-threshold" min="0" max="255" step="5" inputmode="numeric">
        </label>
      </div>
      <span class="hint"><span id="hint-mixed"></span> <button type="button" class="textbtn" id="reset-picks" hidden></button></span>
    </div>
    </div>
    </div>
  </section>

  <section aria-label="Rankings">
    <div class="toolbar">
      <input type="search" id="search" placeholder="Search Pokémon" aria-label="Search Pokémon" autocomplete="off">
      <span class="toolbar-end">
        <span class="count" id="shown-count"></span>
        <button type="button" class="pill" id="export-csv">Export CSV</button>
      </span>
    </div>
    <div class="list">
      <div class="table-scroll">
        <table>
          <thead>
            <tr>
              <th class="l">#</th>
              <th class="l name" data-sort="name"><button type="button">pokémon</button></th>
              <th data-sort="hp"><button type="button" id="hp-head">hp</button></th>
              <th data-sort="atk"><button type="button">atk</button></th>
              <th data-sort="def"><button type="button">def</button></th>
              <th data-sort="spa"><button type="button">spa</button></th>
              <th data-sort="spd"><button type="button">spd</button></th>
              <th data-sort="spe"><button type="button">spe</button></th>
              <th class="l">offense</th>
              <th data-sort="bst"><button type="button">bst</button></th>
              <th class="l score" data-sort="score"><button type="button" id="score-head">effective bst</button></th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </div>
  </section>
  </div>

  <div class="view" id="view-speed" role="tabpanel" aria-labelledby="tab-speed" hidden>
  <section aria-label="Speed you need" id="speed-panel">
    <div class="panel">
    <div class="panel-row" role="group" aria-label="Your Pokémon">
    <span class="row-label">train</span>
    <div class="control">
      <label class="slabel" for="calc-name">pokémon</label>
      <input type="text" id="calc-name" list="speed-names" placeholder="e.g. Garchomp" autocomplete="off" spellcheck="false">
      <datalist id="speed-names"></datalist>
      <span class="hint" id="hint-calc-name"></span>
    </div>
    <div class="control">
      <span class="slabel" id="label-nature">spread</span>
      <div class="control-line">
        <div class="seg" role="radiogroup" aria-labelledby="label-nature" data-group="nature">
          <button type="button" role="radio" data-value="1">+Spe</button>
          <button type="button" role="radio" data-value="0">Neutral</button>
          <button type="button" role="radio" data-value="-1">−Spe</button>

<script src="pokemon-data.js?v=6"></script>
<script src="ebst.js?v=6"></script>
<script src="speed.js?v=1"></script>
<script>
  var EBST_VERSION = 6;
  if (EBST.VERSION !== EBST_VERSION) {
    document.querySelector('main').innerHTML = '<p class="sub"><b>An outdated copy of the scoring code'
      + ' loaded, so scores would be wrong.</b> Reload the page while holding Shift to fetch the current version.</p>';
    throw new Error('ebst.js version ' + EBST.VERSION + ' loaded; page expects ' + EBST_VERSION);
  }
  var STORE_KEY = 'effective-bst-v1';
  var model = EBST.buildModel(POKEMON);
  var SAVED_KEYS = ['model', 'focus', 'speed', 'trickRoom', 'megas', 'mixedOnly', 'mixedMin', 'picks', 'excludedTypes'];
  var state = { model: 'sum', focus: 'full', speed: true, trickRoom: false, megas: 'include', mixedOnly: false,
                mixedMin: EBST.MIXED_MIN, search: '', type: '', excludedTypes: [], sort: 'score', dir: 'desc',
                picks: {} };

  try {
    var saved = JSON.parse(localStorage.getItem(STORE_KEY) || 'null');
    if (saved) SAVED_KEYS.forEach(function (k) {
      if (k in saved) state[k] = saved[k];
    });
    // Older saves stored megas as a checkbox boolean.
    if (typeof state.megas === 'boolean') state.megas = state.megas ? 'include' : 'exclude';
    if (!Array.isArray(state.excludedTypes)) state.excludedTypes = [];
  } catch (e) {}

  function save() {
    try {
      var out = {};
      SAVED_KEYS.forEach(function (k) { out[k] = state[k]; });
      localStorage.setItem(STORE_KEY, JSON.stringify(out));
    } catch (e) {}
  }

  var SCORE_NAME = {
    sum: { full: 'effective bst', bulk: 'effective bulk', offense: 'effective offense' },
    bsr: { full: 'bsr', bulk: 'bsr bulk', offense: 'bsr offense' }
  };
  var LABEL = { physical: 'Phys', special: 'Spec', both: 'Both' };
  var HINTS = {
    model: { sum: 'hp ×1.4 + stats used', bsr: 'smogon base stat rating' },
    focus: { full: 'every stat it uses', bulk: 'hp · def · spd', offense: 'attacking stat only' },
    speed: { off: 'speed ignored', on: 'faster scores higher', tr: 'slower scores higher' },
    megas: { include: 'listed beside base forms', exclude: 'base forms only', only: 'megas only' }
  };
  // Speed is one three-way choice, stored as the speed / trickRoom pair the scorer takes.
  var CHOOSE = {
    model: function (v) { return { model: v }; },
    focus: function (v) { return { focus: v }; },
    speed: function (v) { return { speed: v !== 'off', trickRoom: v === 'tr' }; },
    megas: function (v) { return { megas: v }; },
    mixed: function (v) { return { mixedOnly: v === 'only' }; }
  };

  function choices() {
    return { model: state.model, focus: state.focus,
             speed: !state.speed ? 'off' : state.trickRoom ? 'tr' : 'on',
             megas: state.megas, mixed: state.mixedOnly ? 'only' : 'all' };
  }
  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) { return s.replace(/[&<>"]/g, function (c) { return '&#' + c.charCodeAt(0) + ';'; }); };

  function isMixed(p) {
    return EBST.isMixed(p, state.mixedMin);
  }

  // Picks for Pokémon below the current split stay saved but don't apply.
  function offenseFor(p) {
    return (isMixed(p) && state.picks[p.name]) || EBST.defaultOffense(p);
  }

  function activePickCount() {
    return model.pool.filter(function (p) { return state.picks[p.name] && isMixed(p); }).length;
  }

  function computeRows() {
    var rows = model.pool.map(function (p) {
      var mode = offenseFor(p);
      return { p: p, mode: mode, mixed: isMixed(p), bst: EBST.bst(p),
               score: model.score(p, { model: state.model, mode: mode, trickRoom: state.trickRoom,
                                       focus: state.focus, speed: state.speed }) };
    });
    var ranked = rows.slice().sort(function (a, b) { return b.score - a.score; });
    ranked.forEach(function (r, i) {
      r.rank = i > 0 && r.score === ranked[i - 1].score ? ranked[i - 1].rank : i + 1;
    });
    var min = ranked[ranked.length - 1].score, max = ranked[0].score;
    rows.forEach(function (r) { r.fill = (r.score - min) / (max - min); });
    return rows;
  }

  function sortValue(r, key) {
    if (key === 'score' || key === 'bst') return r[key];
    if (key === 'name') return r.p.name;
    return r.p[key];
  }

  // The rows the table shows, filtered and in display order (also what Export CSV writes).
  function visibleRows() {
    var q = state.search.trim().toLowerCase();
    var rows = computeRows().filter(function (r) {
      var mega = r.p.name.indexOf('-Mega') !== -1;
      if ((state.megas === 'exclude' && mega) || (state.megas === 'only' && !mega)) return false;
      if (state.mixedOnly && !r.mixed) return false;
      if (state.type && r.p.types.indexOf(state.type) === -1) return false;
      if (r.p.types.some(function (t) { return state.excludedTypes.indexOf(t) !== -1; })) return false;
      return !q || r.p.name.toLowerCase().indexOf(q) !== -1;
    });
    var sign = state.dir === 'asc' ? 1 : -1;
    rows.sort(function (a, b) {
      var x = sortValue(a, state.sort), y = sortValue(b, state.sort);
      if (x < y) return -sign;
      if (x > y) return sign;
      return a.rank - b.rank;
    });
    return rows;
  }

  function render() {
    var trActive = state.trickRoom && state.speed;
    var chosen = choices();
    document.querySelectorAll('#view-ebst .panel .seg').forEach(function (seg) {
      var group = seg.dataset.group;
      seg.querySelectorAll('button').forEach(function (b) {
        var on = b.dataset.value === chosen[group];
        b.setAttribute('aria-checked', on);
        b.tabIndex = on ? 0 : -1;
      });
      if (HINTS[group]) $('hint-' + group).textContent = HINTS[group][chosen[group]];
    });
    var mixedCount = model.pool.filter(isMixed).length;
    if (document.activeElement !== $('mixed-threshold')) $('mixed-threshold').value = state.mixedMin;
    $('hint-mixed').textContent = mixedCount + ' can pick phys / spec / both';
    renderTypeFilter();
    $('score-head').textContent = SCORE_NAME[state.model][state.focus];
    // Show HP's weight in its column header when it's counted at 1.4x.
    $('hp-head').textContent = state.model === 'sum' && state.focus !== 'offense' ? 'hp ×' + EBST.HP_WEIGHT : 'hp';
    $('score-head').title = modeNote(trActive).replace(/<[^>]+>/g, '');

    var pickCount = activePickCount();
    $('reset-picks').hidden = Object.keys(state.picks).length === 0;
    $('reset-picks').textContent = '· reset ' + pickCount + ' picks';
    var rows = visibleRows();

    document.querySelectorAll('#view-ebst th[data-sort]').forEach(function (th) {
      var active = th.dataset.sort === state.sort;
      th.setAttribute('aria-sort', active ? (state.dir === 'asc' ? 'ascending' : 'descending') : 'none');
    });

    $('shown-count').textContent = rows.length + ' shown';
    $('footer-state').textContent = [
      state.model === 'sum' ? 'effective sum' : 'bsr', state.focus,
      !state.speed ? 'speed off' : trActive ? 'trick room' : 'speed on',
      pickCount + ' offense picks', 'data reg m-c'
    ].join(' · ');
    $('rows').innerHTML = rows.length ? rows.map(rowHtml).join('')
      : '<tr><td colspan="11" class="empty">No Pokémon match these filters.</td></tr>';
  }

  // Type cell: one "show only" type, plus any number of excluded types shown as removable chips.
  function renderTypeFilter() {
    var excluded = state.excludedTypes;
    $('type-filter').value = state.type;
    $('type-exclude').innerHTML = '<option value="">+ Exclude a type</option>' + TYPE_LIST.filter(function (t) {
      return excluded.indexOf(t) === -1 && t !== state.type;
    }).map(function (t) { return '<option value="' + t + '">' + t + '</option>'; }).join('');
    $('excluded-types').innerHTML = excluded.map(function (t) {
      return '<button type="button" class="chip" data-type="' + esc(t) + '" aria-label="Stop excluding ' + esc(t)
        + '">' + esc(t) + '<span class="x" aria-hidden="true">×</span></button>';
    }).join('');
    var parts = [state.type ? state.type.toLowerCase() + ' as either type' : 'all types'];
    if (excluded.length) parts.push(excluded.length + ' excluded');
    $('hint-type').textContent = parts.join(' · ');
  }

  function modeNote(trActive) {
    var speedPart = !state.speed ? '' : trActive ? ', <b>minus Speed</b> (slower is better)' : ', plus Speed';
    if (state.model === 'sum') {
      var base = { full: '1.4 × HP + Def + SpD + the attacking stat it uses', bulk: '1.4 × HP + Def + SpD only',
                   offense: 'the attacking stat it uses only' }[state.focus];
      return '<b>Effective Sum:</b> ' + base + speedPart + '.';
    }
    var bulk = 'bulk (HP × defenses)';
    var offense = state.speed
      ? 'offense weighted by how many Pokémon it moves before' + (trActive ? ' <b>under Trick Room</b>' : '')
      : 'offense from the attacking stat alone';
    var body = { full: bulk + ' plus ' + offense,
                 bulk: bulk + (state.speed ? ' plus how many Pokémon it moves before'
                   + (trActive ? ' <b>under Trick Room</b>' : '') : ' only'),
                 offense: offense }[state.focus];
    return '<b>BSR:</b> ' + body + '. Rescaled to the Effective Sum range.';
  }

  function rowHtml(r) {
    var p = r.p, name = p.name, megaAt = name.indexOf('-Mega');
    var nameHtml = megaAt === -1 ? esc(name)
      : esc(name.slice(0, megaAt) + name.slice(megaAt + 5)) + '<span class="tag">mega</span>';
    var bulkUsed = state.focus !== 'offense', offUsed = state.focus !== 'bulk';
    var atkUsed = offUsed && r.mode !== 'special', spaUsed = offUsed && r.mode !== 'physical';
    var cell = function (v, used) { return '<td class="stat' + (used ? '' : ' unused') + '">' + v + '</td>'; };
    var spe = !state.speed ? cell(p.spe, false)
      : state.trickRoom ? '<td class="stat neg">−' + p.spe + '</td>' : cell(p.spe, true);
    var offense = r.mixed
      ? '<span class="seg off' + (offUsed ? '' : ' off-idle') + '" role="radiogroup" aria-label="Offense for '
        + esc(name) + '">'
        + ['physical', 'special', 'both'].map(function (m) {
          return '<button type="button" role="radio" data-name="' + esc(name) + '" data-mode="' + m
            + '" aria-checked="' + (r.mode === m) + '">' + LABEL[m] + '</button>';
        }).join('') + '</span>'
      : '<span class="off-fixed' + (offUsed ? '' : ' off-idle') + '">' + LABEL[r.mode] + '</span>';
    return '<tr>'
      + '<td class="l rank">' + r.rank + '</td>'
      + '<td class="l name" title="' + esc(p.types.join(' / ')) + '">' + nameHtml + '</td>'
      + cell(p.hp, bulkUsed)
      + cell(p.atk, atkUsed)
      + cell(p.def, bulkUsed)
      + cell(p.spa, spaUsed)
      + cell(p.spd, bulkUsed)
      + spe
      + '<td class="l">' + offense + '</td>'
      + '<td class="bst">' + r.bst + '</td>'
      + '<td class="l score"><div class="score-cell"><div class="score-bar"><i style="width:'
      + (r.fill * 100).toFixed(1) + '%"></i></div><span class="score-num">' + r.score + '</span></div></td>'
      + '</tr>';
  }

  function update(changes) {
    Object.assign(state, changes);
    save();
    render();
  }

  var panel = document.querySelector('#view-ebst .panel');
  panel.addEventListener('click', function (e) {
    var b = e.target.closest('.seg button');
    if (b) update(CHOOSE[b.closest('.seg').dataset.group](b.dataset.value));
  });
  // Radio-group keys: arrows move the choice within a control.
  function arrowKeys(e) {
    var step = { ArrowRight: 1, ArrowDown: 1, ArrowLeft: -1, ArrowUp: -1 }[e.key];
    var b = e.target.closest('.seg button');
    if (!step || !b) return;
    e.preventDefault();
    var opts = Array.prototype.slice.call(b.parentNode.children);
    var next = opts[(opts.indexOf(b) + step + opts.length) % opts.length];
    next.click();
    next.focus();
  }
  panel.addEventListener('keydown', arrowKeys);
  $('search').addEventListener('input', function (e) { update({ search: e.target.value }); });
  $('mixed-threshold').addEventListener('input', function (e) {
    var v = parseInt(e.target.value, 10);
    if (v >= 0 && v <= 255) update({ mixedMin: v });
  });
  $('mixed-threshold').addEventListener('change', function (e) { e.target.value = state.mixedMin; });
  $('reset-picks').addEventListener('click', function () { update({ picks: {} }); });

  document.querySelector('#view-ebst thead').addEventListener('click', function (e) {
    var th = e.target.closest('th[data-sort]');
    if (!th || !e.target.closest('button')) return;
    var key = th.dataset.sort;
    if (key === state.sort) update({ dir: state.dir === 'asc' ? 'desc' : 'asc' });
    else update({ sort: key, dir: key === 'name' ? 'asc' : 'desc' });
  });

  $('rows').addEventListener('click', function (e) {
    var btn = e.target.closest('.off button');
    if (!btn) return;
    var picks = Object.assign({}, state.picks);
    var p = model.pool.find(function (x) { return x.name === btn.dataset.name; });
    if (btn.dataset.mode === EBST.defaultOffense(p)) delete picks[p.name];
    else picks[p.name] = btn.dataset.mode;
    update({ picks: picks });
  });

  // Type filter: every type in the pool, alphabetical.
  var allTypes = {};
  model.pool.forEach(function (p) { p.types.forEach(function (t) { allTypes[t] = true; }); });
  var TYPE_LIST = Object.keys(allTypes).sort();
  state.excludedTypes = state.excludedTypes.filter(function (t) { return allTypes[t]; });
  TYPE_LIST.forEach(function (t) {
    var opt = document.createElement('option');
    opt.value = t;
    opt.textContent = t;
    $('type-filter').appendChild(opt);
  });
  // Choosing a type to show un-excludes it, so the two can't contradict each other.
  $('type-filter').addEventListener('change', function (e) {
    var t = e.target.value;
    update({ type: t, excludedTypes: state.excludedTypes.filter(function (x) { return x !== t; }) });
  });
  $('type-exclude').addEventListener('change', function (e) {
    if (e.target.value) update({ excludedTypes: state.excludedTypes.concat(e.target.value) });
  });
  $('excluded-types').addEventListener('click', function (e) {
    var chip = e.target.closest('.chip');
    if (!chip) return;
    update({ excludedTypes: state.excludedTypes.filter(function (t) { return t !== chip.dataset.type; }) });
    $('type-exclude').focus();
  });

  // --- Export CSV: the visible rows, in display order ---
  var CSV_SCORE_NAME = {
    sum: { full: 'Effective BST', bulk: 'Effective Bulk', offense: 'Effective Offense' },
    bsr: { full: 'BSR', bulk: 'BSR Bulk', offense: 'BSR Offense' }
  };

  function csvField(v) {
    var s = String(v);
    return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  }

  function buildCsv() {
    var header = ['Rank', 'Pokemon', 'Type 1', 'Type 2', 'HP', 'Atk', 'Def', 'SpA', 'SpD', 'Spe',
                  'Offense', 'BST', CSV_SCORE_NAME[state.model][state.focus]];
    var lines = visibleRows().map(function (r) {
      var p = r.p;
      return [r.rank, p.name, p.types[0], p.types[1] || '', p.hp, p.atk, p.def, p.spa, p.spd, p.spe,
              LABEL[r.mode], r.bst, r.score].map(csvField).join(',');
    });
    return [header.join(',')].concat(lines).join('\n') + '\n';
  }

  function csvFilename() {
    var c = choices();
    return ['effective-bst', c.model, c.focus, c.speed === 'tr' ? 'trick-room' : 'speed-' + c.speed]
      .concat(state.type ? [state.type.toLowerCase()] : [])
      .concat(state.excludedTypes.length ? ['no-' + state.excludedTypes.join('-').toLowerCase()] : [])
      .join('_') + '.csv';
  }

  function flash(btn, text) {
    btn.textContent = text;
    setTimeout(function () { btn.textContent = 'Export CSV'; }, 1600);
  }

  // Outside the claude.ai viewer (e.g. serve.py) there is no window.claude: download directly.
  var inViewer = !!(window.claude && typeof window.claude.use === 'function');
  var downloadsReady = inViewer ? window.claude.use('downloads') : Promise.resolve(null);

  function copyCsv(btn, csv) {
    if (!navigator.clipboard) return flash(btn, 'Export unavailable');
    navigator.clipboard.writeText(csv).then(function () { flash(btn, 'CSV copied'); },
                                            function () { flash(btn, 'Export unavailable'); });
  }

  $('export-csv').addEventListener('click', function () {
    var btn = this, csv = buildCsv(), filename = csvFilename();
    if (!inViewer) {
      var url = URL.createObjectURL(new Blob([csv], { type: 'text/csv' }));
      var a = document.createElement('a');
      a.href = url;
      a.download = filename;
      a.click();
      setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
      return flash(btn, 'Downloaded');
    }
    downloadsReady.then(function (downloads) {
      // No save support in this view: put the CSV on the clipboard instead.
      if (!downloads) return copyCsv(btn, csv);
      downloads.save({ filename: filename, data: csv }).then(function () { flash(btn, 'Saved'); }, function (err) {
        if (err && err.code === 'declined') return;
        if (err && err.code === 'rate_limited') return flash(btn, 'Try again shortly');
        copyCsv(btn, csv);
      });
    });
  });

  render();
</script>
<script>
  // Tabs and the Speed Tiers view. Self-contained, so the tabs still work if the script above stops early.
  (function () {
    var $ = function (id) { return document.getElementById(id); };
    var esc = function (s) { return String(s).replace(/[&<>"]/g, function (c) { return '&#' + c.charCodeAt(0) + ';'; }); };
    var STORE_KEY = 'effective-bst-speed-v1';
    var TITLES = { ebst: 'Effective BST', speed: 'Speed Tiers' };
    var DEFAULT_BENCHES = { out: ['maxplus', 'max'], tr: ['minminus', 'zero'] };
    var SAVED_KEYS = ['tab', 'name', 'nature', 'sp', 'boost', 'goal', 'benches', 'threatsMode', 'threats',
                      'sort', 'dir', 'megas', 'tierSet'];
    var state = { tab: 'ebst', name: '', nature: 1, sp: 32, boost: 'none', goal: 'out',
                  benches: { out: DEFAULT_BENCHES.out.slice(), tr: DEFAULT_BENCHES.tr.slice() },
                  threatsMode: 'meta', threats: null, sort: 'maxplus', dir: 'desc', megas: 'include', tierSet: 'all',
                  search: '', showAbove: false, showBelow: false };

    try {
      var saved = JSON.parse(localStorage.getItem(STORE_KEY) || 'null');
      if (saved) SAVED_KEYS.forEach(function (k) {
        if (k in saved) state[k] = saved[k];
      });
    } catch (e) {}
    if (location.hash === '#speed' || location.hash === '#ebst') state.tab = location.hash.slice(1);

    function save() {
      try {
        var out = {};
        SAVED_KEYS.forEach(function (k) { out[k] = state[k]; });
        localStorage.setItem(STORE_KEY, JSON.stringify(out));
      } catch (e) {}
    }

    // --- Tabs ---
    var tabs = Array.prototype.slice.call(document.querySelectorAll('.tabs [role="tab"]'));

    function showTab() {
      tabs.forEach(function (t) {
        var on = t.dataset.view === state.tab;
        t.setAttribute('aria-selected', on);
        t.tabIndex = on ? 0 : -1;
        $('view-' + t.dataset.view).hidden = !on;
      });
      $('footer-state').hidden = state.tab !== 'ebst';
      $('footer-speed').hidden = state.tab !== 'speed';
      $('page-title').textContent = TITLES[state.tab];
      document.title = TITLES[state.tab];
    }

    document.querySelector('.tabs').addEventListener('click', function (e) {
      var t = e.target.closest('[role="tab"]');
      if (!t) return;
      state.tab = t.dataset.view;
      save();
      showTab();
    });
    document.querySelector('.tabs').addEventListener('keydown', function (e) {
      var step = { ArrowRight: 1, ArrowLeft: -1 }[e.key];
      if (!step) return;
      e.preventDefault();
      var next = tabs[(tabs.indexOf(e.target) + step + tabs.length) % tabs.length];
      next.click();
      next.focus();
    });
    if (!TITLES[state.tab]) state.tab = 'ebst';
    showTab();

    var view = $('view-speed');
    var SPEED_VERSION = 1;
    if (SPEED.VERSION !== SPEED_VERSION) {
      view.innerHTML = '<p class="sub"><b>An outdated copy of the speed code loaded, so speeds would be wrong.</b>'
        + ' Reload the page while holding Shift to fetch the current version.</p>';
      throw new Error('speed.js version ' + SPEED.VERSION + ' loaded; page expects ' + SPEED_VERSION);
    }

    var pool = SPEED.pool(POKEMON);
    var byName = {};
    pool.forEach(function (p) { byName[p.name.toLowerCase()] = p; });
    var BENCH = {};
    SPEED.BENCHMARKS.forEach(function (b) { BENCH[b.key] = b; });
    var TIER_KEYS = SPEED.BENCHMARKS.map(function (b) { return b.key; });
    var NATURE = { '1': '+Spe', '0': 'neutral', '-1': '−Spe' };
    var HINTS = { goal: { out: 'faster moves first', tr: 'slower moves first' } };
    var BOOST_NAME = { scarf: 'Choice Scarf', tailwind: 'Tailwind', plus1: '+1 Speed', minus1: '−1 Speed' };
    var CHOOSE = {
      nature: function (v) { return { nature: Number(v) }; },
      goal: function (v) { return { goal: v, showAbove: false, showBelow: false }; },
      threats: function (v) { return { threatsMode: v }; },
      tierSet: function (v) { return { tierSet: v }; },
      megas: function (v) { return { megas: v }; }
    };

    // Saved values from an older or hand-edited store fall back to the defaults.
    if (!(state.sp >= 0 && state.sp <= SPEED.MAX_SP)) state.sp = SPEED.MAX_SP;
    if (!NATURE[state.nature]) state.nature = 1;
    if (!SPEED.BOOSTS[state.boost]) state.boost = 'none';
    if (!DEFAULT_BENCHES[state.goal]) state.goal = 'out';
    ['out', 'tr'].forEach(function (g) {
      var keys = state.benches && Array.isArray(state.benches[g]) ? state.benches[g].filter(function (k) { return BENCH[k]; }) : [];
      if (!state.benches || typeof state.benches !== 'object') state.benches = {};
      state.benches[g] = keys.length ? keys : DEFAULT_BENCHES[g].slice();
    });
    if (!Array.isArray(state.threats)) state.threats = null;

    function chosen() {
      return { nature: String(state.nature), goal: state.goal, threats: state.threatsMode,
               tierSet: state.tierSet, megas: state.megas };
    }

    // The meta threat set: the starter list until a viewer stars or unstars something.
    function threatNames() {
      return state.threats || SPEED.STARTER_THREATS;
    }

    function isThreat(p) {
      return threatNames().indexOf(p.name) !== -1;
    }

    function toggleThreat(name) {
      var list = threatNames().slice(), i = list.indexOf(name);
      if (i === -1) list.push(name);
      else list.splice(i, 1);
      var starter = SPEED.STARTER_THREATS;
      var same = list.length === starter.length && starter.every(function (n) { return list.indexOf(n) !== -1; });
      update({ threats: same ? null : list.sort() });
    }

    // Like the rankings table, plus a nowrap span so a wrapping cell never splits a name at its hyphen.
    function nameHtml(name) {
      var megaAt = name.indexOf('-Mega');
      var text = megaAt === -1 ? name : name.slice(0, megaAt) + name.slice(megaAt + 5);
      return '<span class="nowrap">' + esc(text) + '</span>' + (megaAt === -1 ? '' : '<span class="tag">mega</span>');
    }

    function starHtml(p) {
      var on = isThreat(p);
      return '<button type="button" class="star" data-name="' + esc(p.name) + '" aria-pressed="' + on + '" aria-label="'
        + (on ? 'Remove ' + esc(p.name) + ' from' : 'Add ' + esc(p.name) + ' to') + ' meta threats">'
        + (on ? '★' : '☆') + '</button>';
    }

    function currentPokemon() {
      return byName[state.name.trim().toLowerCase()] || null;
    }

    // --- What speed do I need: the chosen threat spreads, fastest first, against your Pokémon ---
    function renderNeeds() {
      var p = currentPokemon(), tr = state.goal === 'tr', keys = state.benches[state.goal];
      var q = state.name.trim().toLowerCase();
      var partial = q && pool.some(function (x) { return x.name.toLowerCase().indexOf(q) !== -1; });
      $('hint-calc-name').textContent = p ? p.types.join(' / ').toLowerCase() + ' · base ' + p.spe
        : !q ? 'type or pick a name' : partial ? 'pick a form from the list' : 'not legal in reg m-c';
      $('bench-chips').innerHTML = SPEED.BENCHMARKS.map(function (b) {
        return '<button type="button" class="chip toggle" data-bench="' + b.key + '" aria-pressed="'
          + (keys.indexOf(b.key) !== -1) + '" title="' + esc(b.note) + '">' + b.label + '</button>';
      }).join('');
      var count = threatNames().length;
      $('hint-threats').textContent = state.threatsMode === 'meta' ? count + ' starred · ☆ to edit' : 'all ' + pool.length;
      $('reset-threats').hidden = !state.threats;
      $('needs-section').hidden = !p;
      if (!p) {
        $('hint-spread').textContent = 'speed at level 50';
        $('footer-speed').textContent = ['speed tiers', 'no pokémon picked', count + ' meta threats', 'data reg m-c'].join(' · ');
        return;
      }

      var boost = state.boost;
      var raw = SPEED.stat(p.spe, state.sp, state.nature), mine = SPEED.modify(raw, boost);
      var lo = SPEED.speed(p.spe, 0, -1, boost), hi = SPEED.speed(p.spe, SPEED.MAX_SP, 1, boost);
      $('hint-spread').textContent = 'speed ' + raw + (boost === 'none' ? '' : ' → ' + mine + ' in battle');

      var threats = state.threatsMode === 'all' ? pool : pool.filter(isThreat);
      var list = SPEED.benchmarkList(threats, keys);
      var above = list.filter(function (r) { return r.speed > hi; });
      var below = list.filter(function (r) { return r.speed < lo; });
      var within = list.filter(function (r) { return r.speed >= lo && r.speed <= hi; });

      function how(t) {
        if (!tr && lo > t) return 'any spread';
        if (tr && hi < t) return 'any spread';
        var parts = (tr ? [-1, 0] : [1, 0]).map(function (n) {
          var sp = tr ? SPEED.maxSpUnder(p.spe, n, boost, t) : SPEED.minSpOver(p.spe, n, boost, t);
          return sp === null ? '' : '<span class="how-part">' + NATURE[n] + ' ' + (tr ? '≤ ' : '') + sp + ' sp</span>';
        }).join('');
        return parts || '<span class="muted">out of reach</span>';
      }

      function rowHtml(r) {
        var b = BENCH[r.key], t = r.speed, steps = how(t);
        var cmp = mine === t ? 'tie' : (mine > t) !== tr ? 'first' : 'second';
        return '<tr class="' + cmp + '">'
          + '<td class="spd-num">' + t + '</td>'
          + '<td class="l name" title="' + esc(r.p.types.join(' / ')) + '">' + starHtml(r.p) + nameHtml(r.p.name)
          + '<span class="spread-inline">' + b.label + '</span></td>'
          + '<td class="l spread spread-col" title="' + esc(b.note) + '">' + b.label + '</td>'
          + '<td class="need">' + (tr ? '≤ ' + (t - 1) : (t + 1) + '+') + '<span class="how-inline">' + steps + '</span></td>'
          + '<td class="l how how-col">' + steps + '</td>'
          + '<td class="l vs">' + { first: 'you first', tie: 'speed tie', second: 'they first' }[cmp] + '</td>'
          + '</tr>';
      }

      var yourSpread = NATURE[state.nature] + ' · ' + state.sp + ' sp';
      var youRow = '<tr class="you"><td class="spd-num">' + mine + '</td>'
        + '<td class="l name">' + nameHtml(p.name) + '<span class="tag">you</span>'
        + '<span class="spread-inline">' + yourSpread + '</span></td>'
        + '<td class="l spread spread-col">' + yourSpread + '</td>'
        + '<td class="l how how-col" colspan="3">' + (boost === 'none' ? '' : 'with ' + BOOST_NAME[boost]) + '</td></tr>';

      function foldRow(which, n) {
        var open = which === 'above' ? state.showAbove : state.showBelow;
        var edge = which === 'above' ? 'above your max of ' + hi : 'below your min of ' + lo;
        var outcome = (which === 'above') !== tr ? 'out of reach' : tr ? 'you stay under these at any spread'
          : 'you outspeed these at any spread';
        return '<tr class="fold"><td colspan="6"><button type="button" class="textbtn" data-fold="' + which
          + '" aria-expanded="' + open + '">' + (open ? '− hide ' : '+ show ') + n + ' ' + (n === 1 ? 'spread' : 'spreads')
          + ' ' + edge + ' · ' + outcome + '</button></td></tr>';
      }

      // Your own line sits above the threats it ties with.
      var at = within.filter(function (r) { return r.speed > mine; }).length;
      var html = [];
      if (above.length) html.push(foldRow('above', above.length));
      if (state.showAbove) html = html.concat(above.map(rowHtml));
      html = html.concat(within.slice(0, at).map(rowHtml), [youRow], within.slice(at).map(rowHtml));
      if (below.length) html.push(foldRow('below', below.length));
      if (state.showBelow) html = html.concat(below.map(rowHtml));
      $('needs-rows').innerHTML = html.join('');

      $('needs-summary').innerHTML = '<b>' + esc(p.name) + '</b> reaches <b>' + mine + '</b> at '
        + NATURE[state.nature] + ' ' + state.sp + ' SP' + (boost === 'none' ? '' : ' with ' + BOOST_NAME[boost])
        + ', and anywhere from ' + lo + ' to ' + hi + '. ' + (within.length
          ? 'That range holds <b>' + within.length + '</b> of the ' + list.length
            + ' threat spreads; those are the matchups your spread decides.'
          : 'None of the ' + list.length + ' threat spreads fall in that range, so your spread decides none of them.');
      $('footer-speed').textContent = ['speed tiers', p.name + ' ' + mine, tr ? 'trick room' : 'outspeed',
        count + ' meta threats', 'data reg m-c'].join(' · ');
    }

    // --- Speed tier table: every Reg M-C Pokémon, sortable on any column ---
    function tierRows() {
      var q = state.search.trim().toLowerCase();
      var rows = pool.filter(function (p) {
        var mega = p.name.indexOf('-Mega') !== -1;
        if ((state.megas === 'exclude' && mega) || (state.megas === 'only' && !mega)) return false;
        if (state.tierSet === 'meta' && !isThreat(p)) return false;
        return !q || p.name.toLowerCase().indexOf(q) !== -1;
      }).map(function (p) {
        var r = { p: p, name: p.name, base: p.spe, star: isThreat(p) ? 1 : 0 };
        TIER_KEYS.forEach(function (k) { r[k] = SPEED.benchmark(p, k); });
        return r;
      });
      var key = state.sort, sign = state.dir === 'asc' ? 1 : -1;
      rows.sort(function (a, b) {
        var x = a[key], y = b[key];
        if (x < y) return -sign;
        if (x > y) return sign;
        return b.maxplus - a.maxplus || (a.name < b.name ? -1 : 1);
      });
      // Rank by the sorted column; equal speeds share a rank.
      var tied = key !== 'name' && key !== 'star';
      rows.forEach(function (r, i) {
        r.rank = tied && i > 0 && r[key] === rows[i - 1][key] ? rows[i - 1].rank : i + 1;
      });
      return rows;
    }

    function tierRowHtml(r) {
      var p = r.p;
      return '<tr>'
        + '<td class="l star-col">' + starHtml(p) + '</td>'
        + '<td class="l rank">' + r.rank + '</td>'
        + '<td class="l name" title="' + esc(p.types.join(' / ')) + '"><button type="button" class="train" data-name="'
        + esc(p.name) + '" title="Show the speeds that matter for ' + esc(p.name) + '">' + nameHtml(p.name) + '</button></td>'
        + '<td class="bst">' + r.base + '</td>'
        + TIER_KEYS.map(function (k) {
          return '<td class="stat' + (k === state.sort ? ' sorted' : '') + '">' + r[k] + '</td>';
        }).join('')
        + '</tr>';
    }

    function renderTiers() {
      view.querySelectorAll('th[data-sort]').forEach(function (th) {
        var active = th.dataset.sort === state.sort;
        th.setAttribute('aria-sort', active ? (state.dir === 'asc' ? 'ascending' : 'descending') : 'none');
      });
      var rows = tierRows();
      $('speed-count').textContent = rows.length + ' shown';
      $('speed-rows').innerHTML = rows.length ? rows.map(tierRowHtml).join('')
        : '<tr><td colspan="10" class="empty">No Pokémon match these filters.</td></tr>';
    }

    function render() {
      var c = chosen();
      view.querySelectorAll('.seg[data-group]').forEach(function (seg) {
        var group = seg.dataset.group;
        seg.querySelectorAll('button').forEach(function (b) {
          var on = b.dataset.value === c[group];
          b.setAttribute('aria-checked', on);
          b.tabIndex = on ? 0 : -1;
        });
        if (HINTS[group]) $('hint-' + group).textContent = HINTS[group][c[group]];
      });
      if (document.activeElement !== $('calc-sp')) $('calc-sp').value = state.sp;
      $('calc-boost').value = state.boost;
      renderNeeds();
      renderTiers();
    }

    function update(changes) {
      Object.assign(state, changes);
      save();
      render();
    }

    view.addEventListener('click', function (e) {
      var seg = e.target.closest('.seg[data-group] button');
      if (seg) return update(CHOOSE[seg.closest('.seg').dataset.group](seg.dataset.value));
      var star = e.target.closest('.star');
      if (star) return toggleThreat(star.dataset.name);
      var chip = e.target.closest('[data-bench]');
      if (chip) {
        var keys = state.benches[state.goal], k = chip.dataset.bench;
        // Keep at least one spread, or the list would be empty.
        var next = keys.indexOf(k) === -1 ? keys.concat(k) : keys.length > 1 ? keys.filter(function (x) { return x !== k; }) : keys;
        var benches = Object.assign({}, state.benches);
        benches[state.goal] = TIER_KEYS.filter(function (x) { return next.indexOf(x) !== -1; });
        return update({ benches: benches });
      }
      var fold = e.target.closest('[data-fold]');
      if (fold) return update(fold.dataset.fold === 'above' ? { showAbove: !state.showAbove } : { showBelow: !state.showBelow });
      var train = e.target.closest('.train');
      if (train) {
        $('calc-name').value = train.dataset.name;
        update({ name: train.dataset.name, showAbove: false, showBelow: false });
        $('speed-panel').scrollIntoView();
        return;
      }
      if (e.target.closest('#reset-threats')) update({ threats: null });
    });
    // Radio-group keys: arrows move the choice within a control.
    view.addEventListener('keydown', function (e) {
      var step = { ArrowRight: 1, ArrowDown: 1, ArrowLeft: -1, ArrowUp: -1 }[e.key];
      var b = e.target.closest('.seg[data-group] button');
      if (!step || !b) return;
      e.preventDefault();
      var opts = Array.prototype.slice.call(b.parentNode.children);
      var next = opts[(opts.indexOf(b) + step + opts.length) % opts.length];
      next.click();
      next.focus();
    });
    $('speed-rows').closest('table').querySelector('thead').addEventListener('click', function (e) {
      var th = e.target.closest('th[data-sort]');
      if (!th || !e.target.closest('button')) return;
      var key = th.dataset.sort;
      if (key === state.sort) update({ dir: state.dir === 'asc' ? 'desc' : 'asc' });
      else update({ sort: key, dir: key === 'name' ? 'asc' : 'desc' });
    });
    $('calc-name').addEventListener('input', function (e) {
      update({ name: e.target.value, showAbove: false, showBelow: false });
    });
    $('calc-sp').addEventListener('input', function (e) {
      var v = parseInt(e.target.value, 10);
      if (v >= 0 && v <= SPEED.MAX_SP) update({ sp: v });
    });
    $('calc-sp').addEventListener('change', function (e) { e.target.value = state.sp; });
    $('calc-boost').addEventListener('change', function (e) { update({ boost: e.target.value }); });
    $('speed-search').addEventListener('input', function (e) { update({ search: e.target.value }); });

    $('speed-names').innerHTML = pool.map(function (p) { return '<option value="' + esc(p.name) + '">'; }).join('');
    $('calc-name').value = state.name;
    render();
  })();
</script>
